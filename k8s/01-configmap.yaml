apiVersion: v1
kind: ConfigMap
metadata: {name: locals-config, namespace: locals}
data:
  APP_NAME: Locals
  PORT: "8000"
  LOG_LEVEL: INFO
  DB_POOL_SIZE: "3"
  DB_MAX_OVERFLOW: "2"
  SHUTDOWN_TIMEOUT_SECONDS: "10"
  POSTGRES_DB: music
  POSTGRES_USER: music
  PGDATA: /var/lib/postgresql/data/pgdata
  MINIO_ROOT_USER: locals_minio
  MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:8080,http://127.0.0.1:8080
  SERVICE_NAME: "locals-backend"
  S3_ACCESS_KEY: locals_minio
  S3_ENDPOINT_URL: http://storage:9000
  S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
  S3_BUCKET: music
  S3_REGION: us-east-1
  S3_INIT_TIMEOUT_SECONDS: "120"
  S3_CORS_ORIGINS: '["http://localhost:8080","http://127.0.0.1:8080"]'
  BROWSER_ALLOWED_ORIGINS: '["http://localhost:8080","http://127.0.0.1:8080"]'
  BROWSER_COOKIE_SECURE: "false"
  FRONTEND_PORT: "8080"
  API_UPSTREAM: http://app:8000
  IMAGE_MAX_BYTES: "10485760"
  AUDIO_MAX_BYTES: "104857600"
  UPLOAD_MAX_BODY_SIZE: 128m
  API_READ_TIMEOUT: 600s
  MAP_TILE_URL: https://tile.openstreetmap.org/{z}/{x}/{y}.png
