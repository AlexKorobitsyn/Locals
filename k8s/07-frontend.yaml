apiVersion: v1
kind: Service
metadata: {name: frontend, namespace: locals}
spec:
  selector: {app: frontend}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, namespace: locals}
spec:
  replicas: 1
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      containers:
        - name: nginx
          image: locals-frontend:k8s
          imagePullPolicy: Never
          ports: [{name: http, containerPort: 8080}]
          envFrom:
            - configMapRef: {name: locals-config}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 500m, memory: 128Mi}
          startupProbe:
            httpGet: {path: /config.json, port: http}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /config.json, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /config.json, port: http}
            periodSeconds: 10
