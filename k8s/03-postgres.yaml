apiVersion: v1
kind: Service
metadata: 
  name: db
  namespace: locals
spec:
  clusterIP: None
  selector: 
    app: db
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: 
  name: db
  namespace: locals
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels: 
      app: db
  template:
    metadata:
      labels: {app: db}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9187"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          ports: [{name: postgres, containerPort: 5432}]
          envFrom:
            - configMapRef: {name: locals-config}
            - secretRef: {name: locals-secret}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
          startupProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 10
        - name: postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.19.1
          ports:
            - name: pg-metrics
              containerPort: 9187
          env:
            - name: DATA_SOURCE_URI
              value: "127.0.0.1:5432/music?sslmode=disable"
            - name: DATA_SOURCE_USER
              valueFrom:
                configMapKeyRef:
                  name: locals-config
                  key: POSTGRES_USER
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: locals-secret
                  key: POSTGRES_PASSWORD
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 5Gi}
