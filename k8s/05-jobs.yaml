apiVersion: batch/v1
kind: Job
metadata: {name: migrate, namespace: locals}
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels: {app: migrate}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: locals-backend:k8s
          imagePullPolicy: Never
          command: [alembic, upgrade, head]
          envFrom:
            - configMapRef: {name: locals-config}
            - secretRef: {name: locals-secret}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
---
apiVersion: batch/v1
kind: Job
metadata: {name: storage-init, namespace: locals}
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels: {app: storage-init}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: storage-init
          image: locals-backend:k8s
          imagePullPolicy: Never
          command: [python, -m, APP.storage_init]
          envFrom:
            - configMapRef: {name: locals-config}
            - secretRef: {name: locals-secret}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
