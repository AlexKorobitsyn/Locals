replicas: 1
deploymentStrategy:
  type: Recreate

persistence:
  enabled: true
  size: 1Gi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

readinessProbe:
  timeoutSeconds: 5
livenessProbe:
  timeoutSeconds: 5

initChownData:
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 32Mi

env:
  GF_PLUGINS_PREINSTALL_SYNC: victoriametrics-logs-datasource@0.32.0

grafana.ini:
  analytics:
    reporting_enabled: false
    check_for_updates: false
  log:
    mode: console
    format: json

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: VictoriaLogs
        uid: locals-victorialogs
        type: victoriametrics-logs-datasource
        access: proxy
        url: http://victoria-logs-single-server.victoria-logs.svc.cluster.local:9428
        isDefault: true
        editable: false
        jsonData:
          maxLines: 1000
          vmuiUrl: http://localhost:19428/select/vmui/

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: locals
        orgId: 1
        folder: Locals
        type: file
        disableDeletion: true
        editable: false
        options:
          path: /var/lib/grafana/dashboards/locals

dashboardsConfigMaps:
  locals: locals-logs-dashboard
