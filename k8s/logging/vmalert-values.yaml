server:
  fullnameOverride: vmalert
  replicaCount: 1
  datasource:
    url: http://vmsingle-victoria-metrics-single-server.monitoring.svc.cluster.local:8428
  extraArgs:
    loggerFormat: json
    rule.evalDelay: 5s
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  config:
    alerts:
      groups:
        - name: locals-service-alerts
          type: prometheus
          interval: 15s
          rules:
            - alert: LocalsLoginErrors
              expr: >-
                (100 *
                (sum(rate(locals_login_operations_total{job="locals-pods", 
                outcome="error"}[5m])))/
                (sum(rate(locals_login_operations_total{job="locals-pods", outcome=~"success|error"}[5m]))) > 5)
                and
                (sum(increase(locals_login_operations_total{
                job="locals-pods", outcome=~"success|error"}[5m]))>=10)
              for: 1m
              labels:
                severity: critical
                service: locals-backend
              annotations:
                 summary: "Locals: внутренние ошибки входа"
                 description: >-
                    Ошибками завершились {{ printf "%.1f" $value }}%
                    операций входа за последние 5 минут.
                    Проверьте backend и PostgreSQL. 
            - alert: LocalsAudioUploadErrors
              expr: >-
                (100 * (sum(rate(locals_audio_uploads_total
                {job="locals-pods", outcome="error"}[5m])))/(
                sum(rate(locals_audio_uploads_total{
                job="locals-pods", outcome=~"success|error"}[5m]))) > 5) 
                and 
                (sum(increase(locals_audio_uploads_total{job="locals-pods", 
                outcome=~"success|error"}[5m]))>=10)
              for: 1m
              labels:
                severity: critical
                service: locals-backend
              annotations:
                 summary: "Locals: ошибки загрузки аудио"
                 description: >-
                    Ошибками завершились {{ printf "%.1f" $value }}%
                    операций загрузки аудио за последние 5 минут.
                    Проверьте backend и MinIO.
            - alert: LocalsHttpRequestErrors
              expr: >-
                (100 * (sum(rate(monitoring_locals_http_requests_total
                {handler=~"/api/v1/.*",
                handler!~"/api/v1/health/.*",
                job="locals-pods", status=~"5.."}[5m])))/(
                sum(rate(monitoring_locals_http_requests_total{ handler=~"/api/v1/.*",
                handler!~"/api/v1/health/.*",
                job="locals-pods"}[5m]))) > 5) 
                and 
                (sum(increase(monitoring_locals_http_requests_total{ handler=~"/api/v1/.*",
                handler!~"/api/v1/health/.*",
                job="locals-pods"}[5m]))>=20)
              for: 1m
              labels:
                severity: critical
                service: locals-backend
              annotations:
                 summary: "Locals: высокая доля HTTP 5** за 5 минут"
                 description: >-
                    5** Ошибками завершились {{ printf "%.1f" $value }}%
                    HTTP запросов за последние 5 минут.
                    Проверьте backend, frontend, PostgreSQL, MinIO.
alertmanager:
  enabled: true
  fullnameOverride: alertmanager
  replicaCount: 1
  persistentVolume:
    enabled: true
    size: 128Mi
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
  config:
    global:
      resolve_timeout: 1m
    route:
      receiver: local-ui
      group_by: [alertname, service]
      group_wait: 5s
      group_interval: 15s
      repeat_interval: 1h
    receivers:
      - name: local-ui
