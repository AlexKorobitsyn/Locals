          "gridPos": {
            "x": 18,
            "y": 3,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(locals_probe_cleanup_pending{job=\"locals-pods\",pod=~\"prober-.*\"})",
              "legendFormat": "Очередь",
