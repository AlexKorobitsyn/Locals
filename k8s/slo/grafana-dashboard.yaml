apiVersion: v1
kind: ConfigMap
metadata: {name: locals-slo-dashboard, namespace: monitoring}
data:
  locals-slo.json: |
    {
      "uid": "locals-slo",
      "title": "Locals - SLI, SLO, SLA",
      "tags": [
        "locals",
        "slo"
      ],
      "schemaVersion": 39,
      "version": 3,
      "editable": false,
      "timezone": "browser",
      "refresh": "15s",
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "title": "Краткая сводка про дашборд",
          "type": "text",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 3
          },
          "options": {
            "mode": "markdown",
            "content": "SLO ≥99,5%, SLA ≥99,0% всех трёх сценариев."
          }
        },
        {
          "id": 2,
          "title": "Пробер доступен для сбора",
          "description": "",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "locals-victoriametrics"
          },
          "gridPos": {
            "x": 0,
            "y": 3,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(up{job=\"locals-pods\",pod=~\"prober-.*\"}) or vector(0)",
              "legendFormat": "up",
              "datasource": {
                "type": "prometheus",
                "uid": "locals-victoriametrics"
              },
              "range": false,
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "noValue": "Нет данных",
              "color": {
                "mode": "palette-classic"
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "false",
                      "color": "red"
                    },
                    "1": {
                      "text": "true",
                      "color": "green"
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name",
            "colorMode": "value"
          }
        },
        {
          "id": 3,
          "title": "Сколько прошло с последней проверки, сек",
          "description": "",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "locals-victoriametrics"
          },
          "gridPos": {
            "x": 6,
            "y": 3,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "time() - max by (scenario) (locals_probe_last_completed_timestamp_seconds{job=\"locals-pods\",pod=~\"prober-.*\"})",
              "legendFormat": "{{scenario}}",
              "datasource": {
                "type": "prometheus",
                "uid": "locals-victoriametrics"
              },
              "range": false,
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "noValue": "Нет данных",
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
