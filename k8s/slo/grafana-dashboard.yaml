          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name",
            "colorMode": "value",
            "graphMode": "none"
          }
        },
        {
          "id": 6,
          "title": "Вход: SLI за 5 минут и пороги",
          "description": "Короткое окно для демонстрации, не итог SLA за 30 дней. Неверные данные, таймаут, 4xx/5xx и превышение времени считаются ошибкой.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "locals-victoriametrics"
          },
          "gridPos": {
            "x": 0,
            "y": 11,
            "w": 8,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "(100 * sum by (scenario) (increase(locals_probe_checks_total{job=\"locals-pods\",pod=~\"prober-.*\",scenario=\"login\",result=\"success\"}[5m])) / sum by (scenario) (increase(locals_probe_checks_total{job=\"locals-pods\",pod=~\"prober-.*\",scenario=\"login\"}[5m]))) and on (scenario) (time() - max by (scenario) (locals_probe_last_completed_timestamp_seconds{job=\"locals-pods\",pod=~\"prober-.*\",scenario=\"login\"}) < 120) and on () (max(up{job=\"locals-pods\",pod=~\"prober-.*\"}) == 1)",
              "legendFormat": "SLI пробера",
              "datasource": {
                "type": "prometheus",
                "uid": "locals-victoriametrics"
              },
              "range": true,
              "instant": false
            },
            {
              "refId": "B",
              "expr": "100 * max(locals_probe_slo_ratio{job=\"locals-pods\",pod=~\"prober-.*\",scenario=\"login\"})",
              "legendFormat": "SLO 99,5%",
              "datasource": {
                "type": "prometheus",
                "uid": "locals-victoriametrics"
              },
              "range": true,
              "instant": false
            },
            {
              "refId": "C",
              "expr": "100 * max(locals_probe_sla_ratio{job=\"locals-pods\",pod=~\"prober-.*\",scenario=\"login\"})",
              "legendFormat": "SLA 99,0%",
              "datasource": {
                "type": "prometheus",
                "uid": "locals-victoriametrics"
              },
              "range": true,
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "noValue": "Нет данных",
              "color": {
                "mode": "palette-classic"
              },
              "min": 0,
              "max": 100,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 0,
                "spanNulls": false
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": "SLO.*|SLA.*"
                },
                "properties": [
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "fill": "dash",
                      "dash": [
                        6,
                        4
                      ]
                    }
                  },
                  {
                    "id": "custom.lineWidth",
                    "value": 1
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 7,
          "title": "Вход: бизнес-метрика, SLI за 5 минут",
          "description": "Вспомогательный SLI обработанных операций. Ожидаемые rejected исключены; полную недоступность и неожиданные отказы с правильными данными учитывает пробер.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "locals-victoriametrics"
          },
          "gridPos": {
            "x": 0,
            "y": 19,
            "w": 8,
            "h": 6
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * sum(increase(locals_login_operations_total{job=\"locals-pods\",outcome=\"success\"}[5m])) / sum(increase(locals_login_operations_total{job=\"locals-pods\",outcome=~\"success|error\"}[5m]))",
              "legendFormat": "Успех / (успех + ошибка)",
              "datasource": {
                "type": "prometheus",
                "uid": "locals-victoriametrics"
              },
              "range": true,
              "instant": false
            },
            {
              "refId": "B",
              "expr": "vector(99.5)",
              "legendFormat": "SLO 99,5%",
              "datasource": {
                "type": "prometheus",
                "uid": "locals-victoriametrics"
              },
              "range": true,
              "instant": false
            }
          ],
          "fieldConfig": {
