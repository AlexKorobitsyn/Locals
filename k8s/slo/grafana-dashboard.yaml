          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name",
            "colorMode": "value"
          }
        },
        {
          "id": 22,
          "title": "Входы за выбранный период",
          "description": "Число операций приложения за период, выбранный справа сверху. Учитываются запросы пробера и пользователей; перезапуски счётчиков обрабатываются через increase. Пробер входит отдельно для каждого из трёх сценариев, поэтому в нормальном цикле выполняет три входа.",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "locals-victoriametrics"
          },
          "gridPos": {
            "x": 0,
            "y": 7,
            "w": 8,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(locals_login_operations_total{job=\"locals-pods\",outcome=\"success\"}[$__range]))",
              "legendFormat": "Успешно",
              "datasource": {
                "type": "prometheus",
                "uid": "locals-victoriametrics"
              },
              "range": false,
              "instant": true
            },
            {
              "refId": "B",
              "expr": "sum(increase(locals_login_operations_total{job=\"locals-pods\",outcome=\"error\"}[$__range]))",
              "legendFormat": "Ошибки",
              "datasource": {
                "type": "prometheus",
                "uid": "locals-victoriametrics"
              },
              "range": false,
              "instant": true
            },
            {
              "refId": "C",
              "expr": "sum(increase(locals_login_operations_total{job=\"locals-pods\",outcome=\"rejected\"}[$__range]))",
              "legendFormat": "Отклонено",
              "datasource": {
                "type": "prometheus",
                "uid": "locals-victoriametrics"
              },
              "range": false,
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "min": 0,
              "noValue": "Нет данных",
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Успешно"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "green"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Ошибки"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "red"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Отклонено"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "yellow"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name",
            "colorMode": "value",
            "graphMode": "none"
          }
        },
        {
          "id": 23,
          "title": "Загрузки аудио за выбранный период",
          "description": "Число операций приложения за период, выбранный справа сверху. Учитываются запросы пробера и пользователей; перезапуски счётчиков обрабатываются через increase. Это число загрузок, а не количество файлов, оставшихся в хранилище: пробер удаляет тестовые WAV после проверки.",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "locals-victoriametrics"
          },
          "gridPos": {
            "x": 8,
            "y": 7,
            "w": 8,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(locals_audio_uploads_total{job=\"locals-pods\",outcome=\"success\"}[$__range]))",
              "legendFormat": "Успешно",
              "datasource": {
                "type": "prometheus",
                "uid": "locals-victoriametrics"
              },
              "range": false,
              "instant": true
            },
            {
              "refId": "B",
              "expr": "sum(increase(locals_audio_uploads_total{job=\"locals-pods\",outcome=\"error\"}[$__range]))",
              "legendFormat": "Ошибки",
              "datasource": {
                "type": "prometheus",
                "uid": "locals-victoriametrics"
              },
              "range": false,
              "instant": true
            },
            {
              "refId": "C",
              "expr": "sum(increase(locals_audio_uploads_total{job=\"locals-pods\",outcome=\"rejected\"}[$__range]))",
              "legendFormat": "Отклонено",
              "datasource": {
                "type": "prometheus",
