                      "mode": "fixed",
                      "fixedColor": "yellow"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name",
            "colorMode": "value",
            "graphMode": "none"
          }
        },
        {
          "id": 24,
          "title": "Рецензии за выбранный период",
          "description": "Число операций приложения за период, выбранный справа сверху. Учитываются запросы пробера и пользователей; перезапуски счётчиков обрабатываются через increase.",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "locals-victoriametrics"
          },
          "gridPos": {
            "x": 16,
            "y": 7,
            "w": 8,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(locals_review_submitted_total{job=\"locals-pods\",outcome=\"success\"}[$__range]))",
              "legendFormat": "Успешно",
              "datasource": {
                "type": "prometheus",
                "uid": "locals-victoriametrics"
              },
              "range": false,
              "instant": true
            },
            {
              "refId": "B",
