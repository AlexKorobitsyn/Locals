name: Frontend CI

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql+asyncpg://music:frontend_test_password@127.0.0.1:5432/frontend_ci
      BCRYPT_ROUNDS: '4'
      API_PROXY_TARGET: http://127.0.0.1:8000
      E2E_REAL_API: 'true'
      E2E_MEDIA: 'true'
      BROWSER_ALLOWED_ORIGINS: '["http://127.0.0.1:5173"]'
      BROWSER_COOKIE_SECURE: 'false'
      S3_ENDPOINT_URL: http://127.0.0.1:9000
      S3_PUBLIC_ENDPOINT_URL: http://127.0.0.1:9000
      S3_ACCESS_KEY: frontend-test
      S3_SECRET_KEY: disposable-frontend-test-password
      S3_BUCKET: frontend-ci
      S3_CORS_ORIGINS: '["http://127.0.0.1:5173"]'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: frontend_ci
          POSTGRES_USER: music
          POSTGRES_PASSWORD: frontend_test_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U music -d frontend_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies and verify API contract
        run: |
          python -m pip install -r ../requirements.txt
          npm ci
          npm run api:check
          npm run format:check
      - name: Test and build
        run: |
          npm test
          npm run build
      - name: Generate disposable test secret
        working-directory: .
        run: |
          python - <<'PY'
          import os, secrets
          with open(os.environ['GITHUB_ENV'], 'a') as target:
              target.write('JWT_SECRET_KEY=' + secrets.token_urlsafe(48) + '\n')
              target.write('E2E_ADMIN_EMAIL=ci-admin@example.com\n')
              target.write('E2E_ADMIN_PASSWORD=' + secrets.token_urlsafe(32) + '\n')
          PY
      - name: Start disposable FastAPI
        working-directory: .
        run: |
          docker build -f docker/minio.Dockerfile -t locals-minio:frontend-ci .
          docker run -d --name frontend-minio -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER="$S3_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$S3_SECRET_KEY" \
            -e MINIO_API_CORS_ALLOW_ORIGIN=http://127.0.0.1:5173 \
            locals-minio:frontend-ci
          python -m APP.storage_init
          alembic upgrade head
          python - <<'PY'
          import asyncio, os
          from sqlalchemy import text
          from sqlalchemy.ext.asyncio import create_async_engine
          async def seed():
              engine = create_async_engine(os.environ['DATABASE_URL'])
              async with engine.begin() as connection:
                  await connection.execute(text("INSERT INTO genres (slug, name) VALUES ('frontend-rock', 'Frontend Rock')"))
                  await connection.execute(text("INSERT INTO cities (name, country, lat, lng, timezone) VALUES ('Frontend City', 'RU', 56.83, 60.60, 'Asia/Yekaterinburg')"))
              from sqlalchemy.ext.asyncio import async_sessionmaker
              from APP.core.config import Settings
              from APP.schemas.auth import RegisterInput
              from APP.create_admin import provision_admin
              async with async_sessionmaker(engine, expire_on_commit=False)() as session:
                  await provision_admin(session, Settings(), RegisterInput(email=os.environ['E2E_ADMIN_EMAIL'], password=os.environ['E2E_ADMIN_PASSWORD'], display_name='CI administrator'))
              await engine.dispose()
          asyncio.run(seed())
          PY
          python -m uvicorn APP.main:create_app --factory --host 127.0.0.1 --port 8000 > /tmp/frontend-api.log 2>&1 &
          python - <<'PY'
          import time, urllib.request
          attempts = 60
          for attempt in range(attempts):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8000/api/v1/openapi.json', timeout=2)
                  break
              except OSError:
                  if attempt == attempts - 1:
                      raise
                  time.sleep(1)
          PY
      - name: Browser tests against FastAPI and PostgreSQL
        run: |
          npx playwright install --with-deps chromium firefox
          npm run test:e2e
      - name: Build standalone SPA image
        working-directory: .
        run: |
          docker build --tag locals-frontend:ci frontend
          docker run -d --name frontend-proxy --network host \
            -e FRONTEND_PORT=8080 -e API_UPSTREAM=http://127.0.0.1:8000 \
            locals-frontend:ci
          trap 'docker logs frontend-proxy > /tmp/frontend-proxy.log 2>&1; docker rm -f frontend-proxy' EXIT
          python - <<'PY'
          import json, time, urllib.request
          attempts = 30
          for attempt in range(attempts):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8080/config.json', timeout=2) as response:
                      assert json.load(response)['audio_max_bytes'] > 0
                  break
              except OSError:
                  if attempt == attempts - 1:
                      raise
                  time.sleep(1)
          with urllib.request.urlopen('http://127.0.0.1:8080/studio/tracks/new', timeout=5) as response:
              assert b'<div id="root">' in response.read()
          with urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health/ready', timeout=5) as response:
              assert response.status == 200
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: frontend-results
          path: |
            frontend/dist
            frontend/test-results
            /tmp/frontend-api.log
            /tmp/frontend-proxy.log
          if-no-files-found: ignore
          retention-days: 7
